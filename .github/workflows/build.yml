name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Test app
        run: npm test
      - name: Prepare Sites deployment candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL repository variable'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing VITE_SUPABASE_PUBLISHABLE_KEY repository variable'; exit 1; }
          test -f dist/index.html
          mkdir -p release
          tar -czf release/sites-build.tar.gz .openai/hosting.json dist
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const hosting = JSON.parse(readFileSync('.openai/hosting.json', 'utf8'))
          const metadata = {
            repository: process.env.GITHUB_REPOSITORY,
            source_sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            workflow_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            project_id: hosting.project_id,
            site_url: 'https://rolecall-private.tealcrow6.chatgpt.site',
            publication_status: 'awaiting_authenticated_sites_publication'
          }
          writeFileSync('release/release.json', JSON.stringify(metadata, null, 2) + '\n')
          NODE
          (cd release && sha256sum sites-build.tar.gz release.json > SHA256SUMS)
      - name: Retain tested Sites build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sites-build-${{ github.sha }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Report deployment preparation status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo '### Sites deployment candidate ready' >> "$GITHUB_STEP_SUMMARY"
          echo "Tested source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact is ready for authenticated owner-private Sites publication. Automatic publication is not configured; see docs/sites-delivery.md and issue #59.' >> "$GITHUB_STEP_SUMMARY"
