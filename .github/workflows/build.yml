name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Sites candidate validation
        run: node --test scripts/sites-candidate.node-test.mjs
      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Test app
        run: npm test
      - name: Prepare Sites deployment candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL repository variable'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing VITE_SUPABASE_PUBLISHABLE_KEY repository variable'; exit 1; }
          node scripts/sites-candidate.mjs package release
      - name: Retain tested Sites build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sites-build-${{ github.sha }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Report deployment preparation status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo '### Sites deployment candidate ready' >> "$GITHUB_STEP_SUMMARY"
          echo "Tested source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact is ready for authenticated public Sites publication. Automatic publication is not configured; see docs/sites-delivery.md and issue #59.' >> "$GITHUB_STEP_SUMMARY"
